[package]
description = "Set up OpenTelemetry providers from config"
edition = "2024"
exclude = ["*.iml"]
homepage = "https://github.com/wdonne/otel-config"
keywords = ["config", "otel"]
license = "BSD-2-Clause"
name = "otel-config"
readme = "README.md"
repository = "https://github.com/wdonne/otel-config"
version = "1.0.4"

[dependencies]
config = "0.15.27"
log = "0.4.34"
multi_log = "0.1.2"
opentelemetry = "0.33.1"
opentelemetry-appender-log = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = [
    "grpc-tonic",
    "gzip-http",
    "gzip-tonic",
    "logs",
] }
opentelemetry_sdk = "0.33.1"
simple_logger = "5.2.0"
thiserror = "2.0.21"
